#:tombi schema.strict = false

min_version = "2026.7.6"

[settings]
# Skip re-evaluating the environment if checked within <value>
hook_env.cache_ttl = "10s"

# Only re-evaluate environment variables when changing directories
hook_env.chpwd_only = true

# Cache the output of environment plugins and evaluation scripts
env_cache = true

# Prefer locally cached data and avoid remote version fetching when possible
prefer_offline = true

# Change cargo home dir
rust.cargo_home = "/tmp/cargo"

# I don't care about agent skills
skills.fetch = false

[bootstrap.mise_shell_activate]
bashrc       = { enabled = true, mode = "activate" }
bash_profile = { enabled = true, mode = "shims" }

[dotfiles]
# Link this repo's mise.toml|mise.lock to ~/.config.mise/config.toml|mise.lock
"~/.config/mise/config.toml" = "mise.toml"
"~/.config/mise/mise.lock"   = "mise.lock"

# Link this repo's tombi/config.toml to ~/.config/tombi/config.toml
"~/.config/tombi/config.toml" = "tombi/config.toml"

# Use mise to read ~/.config/github_tokens.toml and set token variable
"~/.bashrc/mise-token" = { block = '''
export MISE_GITHUB_TOKEN="$(mise token github --raw)"
''' }

# Override default mise install/cache directories
"~/.bashrc/mise-storage" = { block = '''
export MISE_STORAGE_OVERRIDE_DIR=/build/${USER}
export MISE_DATA_DIR="${MISE_STORAGE_OVERRIDE_DIR}/mise-${USER}/data"
export MISE_CACHE_DIR="${MISE_STORAGE_OVERRIDE_DIR}/mise-${USER}/cache"
''' }

# Helper to open ghq repo in vscode
"~/.bashrc/qcode" = { block = '''
qcode() {
  local parent_mode=false
  local query=""

  # Check if the first argument is the parent flag
  if [ "$1" = "-p" ]; then
    parent_mode=true
    query="$2"
  else
    query="$1"
  fi

  local repo
  repo=$(ghq list --full-path | fzf --exact --query="$query" --select-1 --exit-0)

  if [ -n "$repo" ]; then
    if [ "$parent_mode" = true ]; then
      # Extracts the parent directory (e.g., handles the owner/org folder)
      local parent_dir
      parent_dir=$(dirname "$repo")
      code "$parent_dir"
    else
      code "$repo"
    fi
  else
    echo "failed to find repo/dir: $query"
    return 1
  fi
}
''' }

[env]
# Forces the sync utility to use the standard Linux bash-completion user directory
MISE_COMPLETIONS_SYNC_BASH_DIR = "{{env.HOME}}/.local/share/bash-completion/completions"

# Set root dir for ghq-cloned repos
GHQ_ROOT = "{{env.HOME}}/repos"

[tasks.upgrade]
description = "Upgrades mise + tools, prunes old versions"
run         = ["mise self-update -y", "mise upgrade --bump", "mise prune -y"]

[tasks.lock]
description = "Update/upgrade lockfile with a global context"
dir         = "~/.config/mise"
run         = ["mise lock --upgrade --global"]

[hooks]
# Install/setup completions
postinstall = [
    "mise completion bash --include-bash-completion-lib > ${MISE_COMPLETIONS_SYNC_BASH_DIR}/mise",
    "misecompsync --shell bash",
]

[tools]
# Required for cargo: types
rust = "1.99.1"

# Magic completions?
"cargo:mise-completions-sync"   = "0.5.20"
"packslip:github.com/jdx/usage" = "7.3.0"

# For just and just accessories
"aqua:casey/just"        = "1.59.0"
"github:terror/just-lsp" = "0.11.1"

# For Todo Tree extension and other ripgrep purposes
"aqua:BurntSushi/ripgrep" = "15.2.0"

# For python
"aqua:astral-sh/uv" = "0.13.7"

# For GitLab stuff
"gitlab:gitlab-org/cli" = "1.130.0"

# For commit hooks
"aqua:evilmartians/lefthook" = { version = "2.2.2", symlink_bins = true }

# For container stuff
"aqua:hadolint/hadolint" = "2.15.1"

# Structured git repo cloning
"aqua:x-motemen/ghq" = "1.12.0"

# Fuzzy finding
"aqua:junegunn/fzf" = "0.75.0"

# Documents as code
"aqua:typst/typst"          = "0.15.1"
"aqua:typstyle-rs/typstyle" = "0.15.2"
cue                         = "0.17.1"
